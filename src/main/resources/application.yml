spring:
  application:
    name: vibeapp
  
  datasource:
    url: jdbc:h2:file:./data/testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
    type: com.zaxxer.hikari.HikariDataSource
  
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        trace: false
        web-allow-others: true

  sql:
    init:
      mode: never

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: INFO
    com.example.vibeapp: DEBUG
    org.springframework.jdbc: DEBUG
    org.hibernate.SQL: DEBUG
